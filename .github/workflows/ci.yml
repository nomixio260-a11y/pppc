name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build client bundle (+ self-contained anp.html)
        run: node scripts/build.mjs
      - name: Unit & integration tests
        run: npm test
      - name: Upload self-contained single-file app
        uses: actions/upload-artifact@v4
        with:
          name: anp-single-file-html
          path: public/anp.html
          # download this artifact, open the .html in a browser — no server needed

