name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build client bundle (+ self-contained anp.html)
        run: node scripts/build.mjs
      - name: Unit & integration tests
        run: npm test
      - name: Upload frontend distribution (all files)
        uses: actions/upload-artifact@v4
        with:
          name: anp-frontend
          path: dist/
          # download, extract, host the folder on any static server (or open
          # anp.html directly); point it at a relay to chat.
      - name: Upload self-contained single-file app
        uses: actions/upload-artifact@v4
        with:
          name: anp-single-file-html
          path: public/anp.html

